name: nightly-screen-readers

# spike/06-guidepup-nvda: this branch repurposes the nightly workflow as the
# spike 6 harness (ROADMAP.md Phase 0) — does Guidepup drive NVDA on a hosted
# Windows runner, and how flaky is it across repeated dispatches? The schedule
# trigger is dropped here; schedules only fire from main anyway, and main's
# copy of this file is untouched.
#
# Dispatch:
#   gh workflow run nightly-screen-readers.yml --ref spike/06-guidepup-nvda \
#     -f browser=firefox -f runs=3

on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to drive (firefox is the primary reader pairing)
        type: choice
        options: [firefox, chromium]
        default: firefox
      runs:
        description: Iterations inside this job (flakiness signal)
        default: '3'

env:
  RAPIDITY_SKIP_BROWSER_INSTALL: '1'

jobs:
  nvda:
    name: "spike 6 — guidepup + NVDA (${{ inputs.browser }} x ${{ inputs.runs }})"
    runs-on: windows-latest
    # Cap billed minutes if NVDA or the browser hangs; windows-latest bills 2x.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install ${{ inputs.browser }}
      - uses: guidepup/setup-action@0.21.0
      - run: pnpm test:sr
        env:
          SR_BROWSER: ${{ inputs.browser }}
          SR_RUNS: ${{ inputs.runs }}

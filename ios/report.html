<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report form — Rapidity iPhone testing</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 34rem; line-height: 1.5; }
      label { display: block; font-weight: 600; margin-top: 1.2rem; }
      input[type='text'], textarea { display: block; width: 100%; font: inherit; padding: 0.5rem; margin-top: 0.3rem; box-sizing: border-box; }
      textarea { min-height: 4.5rem; }
      button { min-height: 48px; font-size: 1rem; padding: 0.6rem 1rem; margin-top: 1.5rem; }
      #out { margin-top: 1rem; min-height: 12rem; font-family: ui-monospace, monospace; }
      #save-note { border: 1px solid #999; padding: 0.5rem; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>Report form</h1>
    <p><a href="index.html">Start</a> · <a href="test-1-gauge.html">Test 1</a> ·
      <a href="test-2-audio.html">Test 2</a></p>

    <p>Answers autosave in this browser as you type. "Build my report" turns them
      into plain text to copy and send to Jeremy.</p>

    <form id="report">
      <h2>Your setup</h2>
      <label for="env-device">iPhone model</label>
      <input type="text" id="env-device" />
      <label for="env-ios">iOS version</label>
      <input type="text" id="env-ios" />
      <label for="env-mute">Mute control: switch or Action button?</label>
      <input type="text" id="env-mute" />

      <h2>Test 1 — the live gauge</h2>
      <label for="q1-1">1.1 — What does VoiceOver say for the gauge, as close to word for word as you can?</label>
      <textarea id="q1-1"></textarea>
      <label for="q1-2">1.2 — Coming back to the gauge while it drifts: current value each time, or stale?</label>
      <textarea id="q1-2"></textarea>
      <label for="q1-3">1.3 — Chatty: keep up, fall behind, or flood? Livable?</label>
      <textarea id="q1-3"></textarea>
      <label for="q1-4">1.4 — Alerts only: crossings of 30 announced reliably, both directions?</label>
      <textarea id="q1-4"></textarea>
      <label for="q1-5">1.5 — Quiet: silent, as it should be?</label>
      <textarea id="q1-5"></textarea>
      <label for="q1-6">1.6 — Quiet instruments, alerts speak, readings mostly by asking ("computer, radiator margin"): gut reaction?</label>
      <textarea id="q1-6"></textarea>

      <h2>Test 2 — sound and the mute switch</h2>
      <label for="q2-1">2.1 — Unmuted, route A: tone audible alongside VoiceOver?</label>
      <textarea id="q2-1"></textarea>
      <label for="q2-2">2.2 — Muting while A plays: tone continues or stops?</label>
      <textarea id="q2-2"></textarea>
      <label for="q2-3">2.3 — Fresh load already muted, start A: any sound?</label>
      <textarea id="q2-3"></textarea>
      <label for="q2-4">2.4 — Route B on the same three checks: differences from A?</label>
      <textarea id="q2-4"></textarea>
      <label for="q2-5">2.5 — Lock/unlock, app-switch away and back: what survived, and what did the status line say?</label>
      <textarea id="q2-5"></textarea>
      <label for="q2-6">2.6 — Did the tone fight VoiceOver — ducking, garbling, volume battles?</label>
      <textarea id="q2-6"></textarea>

      <h2>Anything else</h2>
      <label for="q-open">Anything we didn't ask — annoyances, surprises, ideas</label>
      <textarea id="q-open"></textarea>

      <button type="button" id="build">Build my report</button>
    </form>

    <div aria-live="polite" id="save-note"></div>

    <label for="out">Your report as plain text</label>
    <textarea id="out" readonly></textarea>

    <script>
      const KEY = 'rapidity-ios-report';
      const form = document.getElementById('report');
      const note = document.getElementById('save-note');
      const out = document.getElementById('out');
      const fields = [...form.querySelectorAll('input[type="text"], textarea')];

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
          for (const f of fields) if (saved[f.id]) f.value = saved[f.id];
        } catch (e) { /* no saved answers is fine */ }
      }

      let saveTimer = null;
      function save() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try {
            const data = {};
            for (const f of fields) data[f.id] = f.value;
            localStorage.setItem(KEY, JSON.stringify(data));
          } catch (e) { /* private mode etc.; the copy button still works */ }
        }, 500);
      }
      form.addEventListener('input', save);

      document.getElementById('build').addEventListener('click', async () => {
        const v = (id) => (document.getElementById(id).value.trim() || '(no answer)');
        const lines = [
          'RAPIDITY IPHONE TEST REPORT — VOICEOVER (iOS)',
          `Date: ${new Date().toISOString().slice(0, 10)}`,
          `Device: ${v('env-device')} | iOS: ${v('env-ios')} | Mute control: ${v('env-mute')}`,
          '',
          '== Test 1: live gauge ==',
        ];
        for (let i = 1; i <= 6; i++) lines.push(`1.${i}: ${v('q1-' + i)}`, '');
        lines.push('== Test 2: sound and the mute switch ==');
        for (let i = 1; i <= 6; i++) lines.push(`2.${i}: ${v('q2-' + i)}`, '');
        lines.push('== Anything else ==', v('q-open'), '');

        out.value = lines.join('\n');
        try {
          await navigator.clipboard.writeText(out.value);
          note.textContent = 'Report built and copied to the clipboard. It is also in the text box below.';
        } catch (e) {
          note.textContent = 'Report built. It is in the text box below.';
        }
        out.focus();
      });

      load();
    </script>
  </body>
</html>
